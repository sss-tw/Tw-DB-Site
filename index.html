<!doctype html>
<html lang="en">
<head>
  <title>Turtle WoW Database</title>
  <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
  <link rel="SHORTCUT ICON" href="./assets/templates/wowhead/images/favicon.ico">
  <script src="./assets/templates/wowhead/js/locale_enus.js" type="text/javascript"></script>
  <link href="./assets/templates/wowhead/css/locale_enus.css" type="text/css" rel="stylesheet">
  <link href="./assets/templates/wowhead/css/global.css" type="text/css" rel="stylesheet">
  <link href="./assets/templates/wowhead/css/Mapper.css" type="text/css" rel="stylesheet">
  <script src="./assets/templates/wowhead/js/global.js?v=3" type="text/javascript"></script>
  <script src="./assets/templates/wowhead/js/Markup.js" type="text/javascript"></script>
  <script src="./assets/templates/wowhead/js/Mapper.js" type="text/javascript"></script>
  <link rel="stylesheet" href="./style.css?v=12">
  <script src="./db-config.js?v=7"></script>
</head>
<body>
<div id="layers"></div>
<div id="layout">
  <div id="header">
    <div id="header-logo">
      <a href="./"></a>
      <h1>Turtle WoW Database</h1>
    </div>
    <div id="header-ad">
    </div>
  </div>
  <div id="sidebar">
    <div id="sidebar-contents">
      <a href="javascript:;" class="expand-site" title="Purge ads and expand layout" onclick="g_expandSite()"></a>
      <div id="sidebar-ad">
      </div>
    </div>
  </div>
  <div id="wrapper">
    <div id="toptabs">
      <div id="toptabs-inner">
        <div id="toptabs-right"></div>
        <div id="toptabs-right-generic"></div>
        <div class="clear"></div>
      </div>
    </div>
    <div id="topbar-right">
      <div>
        <form method="get" action="?" id="header-search-form">
          <a href="javascript:;" id="search-submit"></a>
          <input type="text" name="search" size="35" id="live-search-generic" autocomplete="off" placeholder="Search database...">
          <button type="submit" id="home-search-btn">Search</button>
        </form>
        <span id="topbar-extra">
          <span class="lang-toggle">
            <button type="button" id="lang-en-btn">EN</button>
            <button type="button" id="lang-zh-btn">中文</button>
          </span>
        </span>
        <div id="status-line"></div>
      </div>
    </div>
    <div id="topbar">
      <span id="menu-buttons-generic" class="menu-buttons"></span>
      <div class="clear"></div>
    </div>
    <script type="text/javascript">
      try { g_initHeader(0); } catch (e) {}
    </script>
    <div id="main">
      <div id="main-precontents"></div>
      <div id="main-contents" class="main-contents">
        <div id="local-results" role="listbox" aria-label="search suggestions"></div>
        <div id="local-detail"></div>
        <div id="tabs-generic"></div>
        <div id="listview-generic" class="listview"></div>
      </div>
    </div>
  </div>
  <div id="footer"></div>
</div>

<script type="module" src="./app.js?v=107"></script>
</body>
</html>
